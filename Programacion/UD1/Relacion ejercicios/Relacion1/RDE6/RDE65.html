<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let suma = 0;
        let media = 0;
        let temperatura = 0;

        for (let dia = 1; dia <= 7 ; dia++) {
            temperatura = Number(prompt("Introduce la temperatura del dia " + dia + ":"))
            
            while (temperatura < -20 || temperatura > 50) {
                alert("Temperatura incorrecta. Debe estar entre -20 y 50. ")
                temperatura = Number(prompt("Introduce la temperatura del dia " + dia + ":"))
            }
            suma += temperatura
        }
        media = suma / 7
                
        alert("La temperatura media de la semana es: " + media)
           
    </script>
</body>
</html>
