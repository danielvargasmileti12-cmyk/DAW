<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!--
    Crea un programa que simule el paso por boxes de *N* coches. El programa pedirá el nombre del coche y el tiempo que ha tardado en el pit stop. 
    Finaliza cuando se introduzca `"FIN"` como nombre.

Al final, muestra:

* El coche más rápido
* El número total de coches
* El tiempo promedio

#### 🧪 Ejemplo:

```
Nombre del coche 1: Rayo
Tiempo en boxes: 5.4
Nombre del coche 2: Mate
Tiempo en boxes: 7.1
Nombre del coche 3: Luigi
Tiempo en boxes: 4.9
Nombre del coche 4: FIN

Total de coches: 3
Tiempo medio: 5.8 segundos
El coche más rápido fue Luigi con 4.9 segundos-->

    <script>
        let nombreCoche = "";
        let boxexTime = 0;
        let contadorCoche = 0;
        let tiempoTotal = 0;
        let tiempoMedia = 0;
        let tiempoRapido = 0;
        let cocheVeloz = "";

        while (nombreCoche != "FIN") {
            nombreCoche = prompt("Nombre del coche " + (contadorCoche + 1) + ":")


            if (nombreCoche != "FIN") {
                boxexTime = Number(prompt("Tiempo en boxes:"))
                contadorCoche++;
                tiempoTotal += boxexTime;

                if (contadorCoche == 1 || boxexTime < tiempoRapido) {
                    tiempoRapido = boxexTime;
                    cocheVeloz = nombreCoche;
                }
            }

        }

        tiempoMedia = tiempoTotal / contadorCoche;

        alert("Total de coches: " + contadorCoche)
        alert("Tiempo medio: " + tiempoMedia + " segundos ")
        alert("El coche mas rapido fue " +  cocheVeloz + " con " + tiempoRapido + " segundos")

    </script>
</body>

</html>
