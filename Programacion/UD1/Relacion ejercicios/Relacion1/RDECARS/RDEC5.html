<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!--
    Luigi tiene una tienda de neumáticos. Cada cliente pide un número de ruedas (entre 1 y 4). 
    El programa continúa hasta que se introduzca un 0. Al final:

* Muestra cuántos neumáticos se vendieron en total
* Cuántos clientes atendió
* Cuántos pidieron 4 neumáticos (cambio completo)

> Usa `while` y condiciones para contar.

#### 🧪 Ejemplo:

```
Cliente 1: 2 neumáticos
Cliente 2: 4 neumáticos
Cliente 3: 1 neumático
Cliente 4: 4 neumáticos
Cliente 5: 0

Total de clientes: 4
Neumáticos vendidos: 11
Clientes con cambio completo: 2
-->

    <script>
        const NUMERONEUMATICOS = 4;
        const REINICIO = 0;

        let contadorClientes = 0;
        let totalNeumaticos = 0;
        let neumaticos = 0;
        let cambioCompleto = 0;

        neumaticos = Number(prompt("Cliente " + (contadorClientes + 1)))

        while (neumaticos != REINICIO) {
            contadorClientes++;
            totalNeumaticos += neumaticos;

            if (neumaticos === NUMERONEUMATICOS) {
                cambioCompleto++;
            }
            neumaticos = Number(prompt("Cliente " + (contadorClientes + 1)));
        }
        alert("Total de clientes: " + contadorClientes);
        alert("Neumaticos vendidos: " + totalNeumaticos);
        alert("Clientes con cambio completo: " + cambioCompleto);

    </script>
</body>

</html>
