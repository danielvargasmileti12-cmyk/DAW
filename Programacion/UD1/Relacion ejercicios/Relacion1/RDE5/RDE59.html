<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let numeroUsuario = Number(prompt("Introduzca un numero entero"))
        if (numeroUsuario >= 0) {
            
            let suma = ""
            let totalSuma = 0

            for (let i = 1; i <= numeroUsuario; i++) {
                totalSuma += i
                if (i < numeroUsuario) {
                    suma += i + " + "
                } else {
                    suma += i + " = "
                }
            }
            console.log(suma + totalSuma);
        } else {
            console.log("Introduzca un numero valido");
        }
    </script>
</body>

</html>
