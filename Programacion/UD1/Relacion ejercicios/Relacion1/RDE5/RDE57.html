<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
          let numeroUsuario=Number(prompt("Introduzca un numero entero"))
          let consolaMostrar = "";

          for (let i = numeroUsuario; i >= 0 ; i--) {
            consolaMostrar += i + "\n"
        }
        
        console.log(consolaMostrar);
    </script>
</body>
</html>
