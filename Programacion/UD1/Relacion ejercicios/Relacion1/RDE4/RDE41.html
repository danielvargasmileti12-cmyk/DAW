<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
         
         let numeroEntero = Number(prompt("Introduzca un numero positivo"))

         if (numeroEntero < 0) {
            console.log("Introduzca un numero valido");
            
         }else{
            for ( let i = 1 ; i <= 10; i++)
            console.log(numeroEntero + " x " + i + " = " + (numeroEntero*i));
         }
            

        
    </script>
</body>
</html>
