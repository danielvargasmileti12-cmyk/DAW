<body>

    <script>
        const PORCENTAJE_LUNA = 16.5
        const CONVERSION_PESO_LUNA = PORCENTAJE_LUNA / 100
        let peso = prompt("Introduzca el peso")
        let pesoLuna = peso * CONVERSION_PESO_LUNA
        console.log(
            "tu peso en la luna seria" + " " + pesoLuna + "Kg"
        );
    </script>
