<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let cantidadMinutos = Number(prompt("Introduzca aqui la cantidad de minutos"))
        let horas = parseInt (cantidadMinutos / 60)
        let minutosRestantes = cantidadMinutos % 60
        
        console.log("La cantidad de minutos a horas y minutos es" + " " + horas +  " " + "horas" + " " + minutosRestantes + " " + " minutos"
            
        );
        
    </script>
</body>
</html>
