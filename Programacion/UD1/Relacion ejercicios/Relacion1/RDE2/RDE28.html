<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        
        const HORAS = 60
         let distanciaRecorrida = Number(prompt("Introduzca aqui la distancia recorrida en Km"))
         let tiempoMinutos = Number(prompt("Introduzca aqui el tiempo en minutos"))
        
         let velocidadMedia = distanciaRecorrida / tiempoMinutos * HORAS
         
         console.log(
            "La velocidad media seria de " + " " + velocidadMedia + "Km/h"
        );
  
    </script>
</body>

</html>
