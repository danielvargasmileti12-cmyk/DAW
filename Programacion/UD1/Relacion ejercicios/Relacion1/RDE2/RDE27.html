    <script>
     
     let peso = Number(prompt("Introduzca aqui su peso"))
     let altura = Number(prompt("Introduzca aqui su altura"))

     console.log(
        "Su indice de masa corporal seria de " + " " + imc + " " + "kg/m2"
    );
     
     </script>
